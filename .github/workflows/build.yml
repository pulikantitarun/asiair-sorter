name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install customtkinter matplotlib numpy pyinstaller
      - name: Run tests
        run: python -m unittest discover -p "test_*.py"
      - name: Build portable application
        run: |
          pyinstaller --onefile --windowed `
            --collect-all customtkinter `
            --collect-all matplotlib `
            --hidden-import numpy `
            --icon asiair_sorter.ico `
            --name ASIAIR_Sorter `
            asiair_sorter.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\asiair_sorter_setup.iss
      - name: Stage Windows files
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\ASIAIR_Sorter.exe release\ASIAIR_Sorter_Windows_Portable_v3.2.exe
          Copy-Item installer_output\ASIAIR_Sorter_Setup_v3.2.exe release\ASIAIR_Sorter_Setup_v3.2.exe
          Get-FileHash release\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASIAIR-Sorter-Windows
          path: release/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install customtkinter matplotlib numpy pyinstaller
      - name: Run tests
        run: python -m unittest discover -p 'test_*.py'
      - name: Build macOS application
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --collect-all customtkinter \
            --collect-all matplotlib \
            --hidden-import numpy \
            --name ASIAIR_Sorter \
            asiair_sorter.py
          ditto -c -k --sequesterRsrc --keepParent dist/ASIAIR_Sorter.app ASIAIR_Sorter_macOS_v3.2.zip
          shasum -a 256 ASIAIR_Sorter_macOS_v3.2.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASIAIR-Sorter-macOS
          path: |
            ASIAIR_Sorter_macOS_v3.2.zip
            SHA256SUMS-macOS.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install customtkinter matplotlib numpy pyinstaller
      - name: Run tests
        run: python -m unittest discover -p 'test_*.py'
      - name: Build Linux application
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          pyinstaller --noconfirm --clean --onefile --windowed \
            --collect-all customtkinter \
            --collect-all matplotlib \
            --hidden-import numpy \
            --name ASIAIR_Sorter \
            asiair_sorter.py
          chmod +x dist/ASIAIR_Sorter
          tar -C dist -czf ASIAIR_Sorter_Linux_x86_64_v3.2.tar.gz ASIAIR_Sorter
          sha256sum ASIAIR_Sorter_Linux_x86_64_v3.2.tar.gz > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASIAIR-Sorter-Linux
          path: |
            ASIAIR_Sorter_Linux_x86_64_v3.2.tar.gz
            SHA256SUMS-Linux.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ASIAIR-Sorter-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ASIAIR Session Sorter ${{ github.ref_name }}
          body: |
            ASIAIR Session Sorter 3.2 adds a redesigned desktop interface,
            a zoomable PHD2 timeline with a separate event strip and window RMS,
            a guide-star target plot, and a Next Session panel that explains
            what to check first using evidence from the guide log.

            Also includes FITS quality ranking, session reports, target aliases,
            weather import, database maintenance, and ASIAIR media detection
            with optional eject after verified copying.

            Import is copy-and-verify only. Raw FITS files are never removed
            automatically. Cleanup remains separate and approval-only.

            The Windows installer upgrades an existing installation in place
            and preserves saved source and destination settings.
          files: release/*
